
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>FORMULAIRE</title>
    <link rel="stylesheet" href="style formulair.css">
  </head>
  <body>
    
    <section>
      
      <h1>Connexion</h1>
      
      <div class="input-box">
        <input type="text" placeholder="Nom d'utilisateur" required>
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Mot de passe" required>
        <i class="fa-solid fa-lock"></i>
      </div>
      <div class="remember">
        <label>
          <input type="checkbox"> Se souvenir de moi
        </label>
        <a href="#">Mot de passe oublié</a>
      </div>
      
      <div class="login">
        <!-- Bouton propre qui redirige -->
        <button type="button" onclick="window.location.href='siteweb.html'">
          Connexion
        </button>
      </div>
      
    </section>

  </body>
</html>
